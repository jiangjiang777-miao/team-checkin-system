<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Team Check-in System · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#060b12;--panel:rgba(10,22,38,.62);--border:rgba(255,255,255,.09);--text:#e2ebf5;--muted:#7d95b3;--grid:rgba(255,255,255,.04);--accent:#8ecfff;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;}
  .grid{position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px;}
  .wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:36px 24px 80px;}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;}
  .back{font-size:13px;color:var(--muted);text-decoration:none;border:1px solid var(--border);padding:8px 16px;border-radius:4px;transition:.2s;}
  .back:hover{color:#fff;border-color:rgba(255,255,255,.25);}
  .title{text-align:center;}
  .title h1{font-size:clamp(22px,4vw,32px);font-weight:700;letter-spacing:.04em;}
  .title .period{font-size:12px;color:var(--muted);letter-spacing:.12em;margin-top:6px;text-transform:uppercase;}

  .lock{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:42px 32px;text-align:center;max-width:360px;margin:80px auto 0;}
  .lock h2{font-size:18px;margin-bottom:8px;}
  .lock p{font-size:13px;color:var(--muted);margin-bottom:20px;}
  .lock input{width:100%;padding:12px 14px;border-radius:6px;border:1px solid var(--border);background:rgba(0,0,0,.25);color:#fff;font-size:14px;outline:none;margin-bottom:14px;}
  .lock input:focus{border-color:var(--accent);}
  .lock button{width:100%;padding:12px;border-radius:6px;border:none;background:#fff;color:#060b12;font-weight:600;cursor:pointer;}
  .lock .err{color:#f5a8a8;font-size:12px;margin-top:10px;min-height:18px;}

  .toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:22px;padding:16px;background:var(--panel);border:1px solid var(--border);border-radius:8px;}
  .toolbar label{font-size:12px;color:var(--muted);}
  .toolbar input[type="date"],.toolbar input[type="text"]{padding:10px 12px;border-radius:6px;border:1px solid var(--border);background:rgba(0,0,0,.25);color:#fff;font-size:13px;outline:none;}
  .toolbar input[type="text"]{flex:1;min-width:220px;}
  .toolbar input:focus{border-color:var(--accent);}
  .toolbar button{padding:10px 14px;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,.08);color:#dbe8f8;font-size:12px;cursor:pointer;transition:.2s;}
  .toolbar button:hover{background:rgba(255,255,255,.14);}
  .toolbar button.primary{background:#fff;color:#060b12;border-color:#fff;font-weight:600;}

  .hint{font-size:12px;color:var(--muted);margin-bottom:18px;line-height:1.6;}
  .hint code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:4px;font-family:'IBM Plex Mono',monospace;}

  .matrix{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:18px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:12px 10px;text-align:center;border-bottom:1px solid var(--border);}
  th{background:rgba(0,0,0,.2);color:#b8cce6;font-weight:500;font-size:11px;letter-spacing:.04em;}
  td:first-child{text-align:left;font-weight:500;color:#fff;}
  td label{cursor:pointer;display:flex;align-items:center;justify-content:center;}
  td input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;}
  tr:hover td{background:rgba(255,255,255,.03);}

  .actions{display:flex;gap:12px;align-items:center;}
  .actions button{padding:12px 22px;border-radius:6px;border:none;background:#fff;color:#060b12;font-weight:600;cursor:pointer;}
  .actions .saved{font-size:12px;color:#8ecfff;opacity:0;transition:opacity .3s;}
  .actions .saved.show{opacity:1;}

  @media (max-width:640px){
    .toolbar{flex-direction:column;align-items:stretch;}
    .toolbar input[type="text"]{width:100%;}
    th,td{padding:10px 6px;font-size:12px;}
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <header>
      <a class="back" href="./checkin-globe.html">← Back to Globe</a>
      <div class="title">
        <h1>ADMIN PANEL</h1>
        <div class="period">Data Entry · 组长专用</div>
      </div>
      <a class="back" href="./checkin-stats.html?project=morning">Stats →</a>
    </header>

    <div class="lock" id="lockScreen">
      <h2>管理员入口</h2>
      <p>只有组长可以修改打卡数据，其他人仅可浏览统计页。</p>
      <input type="password" id="pwdInput" placeholder="输入密码" />
      <button id="unlockBtn">解锁</button>
      <div class="err" id="pwdErr"></div>
    </div>

    <div id="adminPanel" style="display:none;">
      <div class="toolbar">
        <label>日期</label>
        <input type="date" id="datePick" />
        <input type="text" id="quickInput" placeholder="例如：龍M yzR 火烧云D" />
        <button class="primary" id="applyQuick">应用快速输入</button>
        <button id="clearAll" style="border-color:rgba(255,150,150,.5);color:#ffc4c4;background:rgba(255,120,120,.12);">清空所有数据</button>
        <button id="resetAll">重置为全勤（8/1 起）</button>
      </div>
      <p class="hint">勾选 = 今日完成；取消勾选 = 缺席。快速输入格式：<code>成员名+项目简写</code>（M/R/D），多个用空格分隔。<br><b>「清空所有数据」</b>会彻底删除全部记录（统计页回到空白，从 8/1 起重新记）；<b>「重置为全勤」</b>仅把 8/1 起恢复为全员完成。</p>

      <div class="matrix">
        <table id="matrixTable"></table>
      </div>

      <div class="actions">
        <button id="saveBtn">保存今日数据</button>
        <span class="saved" id="savedHint">已保存到本地</span>
      </div>
    </div>
  </div>

<script src="./checkin-data.js?v=2"></script>
<script>

  // 纯前端 SHA-256（UTF-8 安全），用于校验组长密码，源码中不含明文
  function sha256(message){
    const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
    const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    function ROTR(n, x){ return (x >>> n) | (x << (32 - n)); }
    message = unescape(encodeURIComponent(message));
    const l = message.length, bitLen = l * 8;
    const pad = (56 - ((l + 1) % 64) + 64) % 64;
    const m = new Uint8Array(l + 1 + pad + 8);
    for (let i = 0; i < l; i++) m[i] = message.charCodeAt(i);
    m[l] = 0x80;
    m[l + 1 + pad + 7] = bitLen & 0xff;
    m[l + 1 + pad + 6] = (bitLen >>> 8) & 0xff;
    m[l + 1 + pad + 5] = (bitLen >>> 16) & 0xff;
    m[l + 1 + pad + 4] = (bitLen >>> 24) & 0xff;
    for (let off = 0; off < m.length; off += 64) {
      const w = new Array(64);
      for (let i = 0; i < 16; i++) w[i] = (m[off+i*4]<<24)|(m[off+i*4+1]<<16)|(m[off+i*4+2]<<8)|(m[off+i*4+3]);
      for (let i = 16; i < 64; i++) {
        const s0 = ROTR(7, w[i-15]) ^ ROTR(18, w[i-15]) ^ (w[i-15] >>> 3);
        const s1 = ROTR(17, w[i-2]) ^ ROTR(19, w[i-2]) ^ (w[i-2] >>> 10);
        w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
      }
      let a=H[0], b=H[1], cc=H[2], d=H[3], e=H[4], f=H[5], g=H[6], h=H[7];
      for (let i = 0; i < 64; i++) {
        const S1 = ROTR(6, e) ^ ROTR(11, e) ^ ROTR(25, e);
        const ch = (e & f) ^ ((~e) & g);
        const t1 = (h + S1 + ch + K[i] + w[i]) | 0;
        const S0 = ROTR(2, a) ^ ROTR(13, a) ^ ROTR(22, a);
        const maj = (a & b) ^ (a & cc) ^ (b & cc);
        const t2 = (S0 + maj) | 0;
        h=g; g=f; f=e; e=(d + t1)|0; d=cc; cc=b; b=a; a=(t1 + t2)|0;
      }
      H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+cc)|0; H[3]=(H[3]+d)|0;
      H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
    }
    return H.map(v => (v >>> 0).toString(16).padStart(8, '0')).join('');
  }

  const lockScreen = document.getElementById('lockScreen');
  const adminPanel = document.getElementById('adminPanel');
  const pwdInput = document.getElementById('pwdInput');
  const unlockBtn = document.getElementById('unlockBtn');
  const pwdErr = document.getElementById('pwdErr');

  unlockBtn.addEventListener('click', () => {
    if (sha256(ADMIN_SALT + pwdInput.value) === ADMIN_PWD_HASH) {
      lockScreen.style.display = 'none';
      adminPanel.style.display = 'block';
    } else {
      pwdErr.textContent = '密码错误';
      pwdInput.value = '';
    }
  });
  pwdInput.addEventListener('keydown', e => { if (e.key === 'Enter') unlockBtn.click(); });

  const datePick = document.getElementById('datePick');
  const today = new Date();
  const augFirst = new Date('2026-08-01');
  const defaultDate = today >= augFirst ? today : augFirst;
  datePick.value = defaultDate.toISOString().slice(0, 10);

  function renderMatrix(){
    const ds = datePick.value;
    const records = getRecords();
    // 未记录时不自动落盘全勤，只用内存默认视图渲染；用户真正改动（勾选/快速输入）后才写入
    const day = records[ds] || buildDefaultDay();

    let html = `<thead><tr><th>成员</th>`;
    for (const p of PROJECTS) html += `<th>${p.name} <span style="opacity:.6">(${p.short})</span></th>`;
    html += `</tr></thead><tbody>`;

    for (const m of MEMBERS) {
      html += `<tr data-member="${m}"><td>${m}</td>`;
      for (const p of PROJECTS) {
        const checked = day[m][p.key] ? 'checked' : '';
        html += `<td><label><input type="checkbox" data-key="${p.key}" ${checked}></label></td>`;
      }
      html += `</tr>`;
    }
    html += `</tbody>`;
    document.getElementById('matrixTable').innerHTML = html;
  }

  document.getElementById('matrixTable').addEventListener('change', e => {
    if (!e.target.matches('input[type="checkbox"]')) return;
    const tr = e.target.closest('tr');
    const member = tr.dataset.member;
    const key = e.target.dataset.key;
    const ds = datePick.value;
    setAbsence(ds, member, key, !e.target.checked);
    flashSaved();
  });

  document.getElementById('applyQuick').addEventListener('click', () => {
    const text = document.getElementById('quickInput').value.trim();
    if (!text) return;
    const ds = datePick.value;
    const list = parseAbsenceInput(text);
    for (const item of list) setAbsence(ds, item.member, item.key, true);
    document.getElementById('quickInput').value = '';
    renderMatrix();
    flashSaved();
  });

  document.getElementById('resetAll').addEventListener('click', () => {
    if (confirm('确定重置 8/1 起 31 天全部为全勤？这会覆盖现有记录。')) {
      resetAllComplete();
      renderMatrix();
      flashSaved();
    }
  });

  document.getElementById('clearAll').addEventListener('click', () => {
    if (confirm('确定清空所有打卡记录？\n清空后统计页将显示“暂无数据”，需从 8 月 1 日起重新在后台记录。此操作不可撤销。')) {
      clearAllData();
      renderMatrix();
      flashSaved();
    }
  });

  document.getElementById('saveBtn').addEventListener('click', () => {
    flashSaved();
  });

  function flashSaved(){
    const el = document.getElementById('savedHint');
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 1400);
  }

  datePick.addEventListener('change', renderMatrix);
  renderMatrix();
</script>
</body>
</html>
